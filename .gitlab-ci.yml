stages:
  - test

variables:
  GO_VERSION: "1.25"
  # Testcontainers configuration for GitLab CI with Docker socket
  DOCKER_HOST: "unix:///var/run/docker.sock"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  # Remove any TLS settings to use the socket directly
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"

test:
  stage: test
  image: golang:${GO_VERSION}
  before_script:
    - echo "172.17.0.1 host.docker.internal" >> /etc/hosts
    - apt-get update -qq && apt-get install -y -qq docker.io curl
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin
    - docker version
  script:
    - cd ./app
    - export GOFLAGS="-buildvcs=false"
    # Check formatting
    - |
      if [ -n "$(gofmt -l .)" ]; then
        echo "Go code is not formatted. Please run go fmt ./..."
        gofmt -d .
        exit 1
      fi
    # Run linter
    - echo "Start linter"
    - golangci-lint run
    # Build
    - echo "Start build"
    - go build -v ./...
    # Run tests
    - echo "Start integration tests"
    - go test ./... -v --tags=integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
